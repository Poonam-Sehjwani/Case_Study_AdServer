spring.application.name=retail-platform
server.port=8001

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=unrestricted


# Kafka broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer configuration
spring.kafka.consumer.group-id=retail-event-processors
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.retail.streaming.dto.RetailEventRequest
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.retail.streaming.dto


# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/retail_analytics}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG


# Auth0 JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://dev-mbtj5b53zbfuyycr.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:https://retail-platform-api}
